const COL=['#FFD84D','#FF7EB6','#7EE0FF','#A6F28B'];
const SEC={jk:'日本語 → 韓国語',kj:'韓国語 → 日本語',au:'音声の聞き取り',fill:'例文の穴埋め'};
let Q,i,score,miss,full,MODE='B',player=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const parts=tr=>tr.split(/[・（）()、]/).map(s=>s.trim().replace(/^-/,'')).filter(Boolean);
function overlaps(a,b){for(const x of parts(a))for(const y of parts(b)){
  if(x===y)return true;
  if(Math.min(x.length,y.length)>=2&&(x.includes(y)||y.includes(x)))return true;
  if(x.length>=2&&y.length>=2&&x.slice(0,2)===y.slice(0,2)&&/[一-鿿]/.test(x.slice(0,2)))return true;}
  return false}
const trOf=w=>WORDS.find(x=>x.w===w).tr;
const pickEx=w=>{const e=EXAMPLES[w];return e[Math.floor(Math.random()*e.length)]};
function makeQ(){
  const used=new Set(),qs=[];
  const order=shuffle(WORDS);
  const take=(n,ok)=>{const r=[];for(const e of order){if(r.length===n)break;if(!used.has(e.w)&&ok(e)){r.push(e);used.add(e.w)}}return r};
  for(const e of take(5,()=>true)){
    const wrong=shuffle(WORDS.filter(x=>x.w!==e.w&&!overlaps(x.tr,e.tr))).slice(0,3).map(x=>x.w);
    const o=shuffle([e.w,...wrong]); qs.push({t:'jk',p:e.tr,o,a:o.indexOf(e.w),w:e.w,m:e.tr,ex:pickEx(e.w)});
  }
  for(const e of take(5,()=>true)){
    const wrong=shuffle(WORDS.filter(x=>x.w!==e.w&&!overlaps(x.tr,e.tr))).slice(0,3).map(x=>x.tr);
    const o=shuffle([e.tr,...wrong]); qs.push({t:'kj',p:e.w,o,a:o.indexOf(e.tr),w:e.w,m:e.tr,ex:pickEx(e.w)});
  }
  for(const e of take(5,e=>AUDIO.some(a=>a.w===e.w))){
    const a=shuffle(AUDIO.filter(x=>x.w===e.w))[0];
    const isPhrase=a.f.includes('/p_');
    const pool=AUDIO.filter(x=>x.w!==a.w&&(x.f.includes('/p_')===isPhrase)&&x.ja!==a.ja&&!overlaps(trOf(x.w),trOf(a.w)));
    const wrong=shuffle(pool).slice(0,3).map(x=>x.ja);
    const o=shuffle([a.ja,...wrong]); qs.push({t:'au',f:a.f,ko:a.ko,o,a:o.indexOf(a.ja),w:a.ko,m:a.ja});
  }
  for(const e of take(5,e=>FILL.some(f=>f.w===e.w))){
    const f=FILL.find(x=>x.w===e.w);
    const o=shuffle([f.a,...f.wrong]); qs.push({t:'fill',p:f.p,hint:f.hint,o,a:o.indexOf(f.a),w:f.w,m:trOf(f.w),ex:f.ex});
  }
  return qs;
}
function koVoice(){return speechSynthesis.getVoices().find(v=>/^ko(-|_|$)/i.test(v.lang))}
function play(){
  const q=Q[i];$('#vmsg').textContent='';
  if(player){player.pause();player=null}
  if(MODE==='A'){
    if(!('speechSynthesis' in window)||!koVoice()){$('#vmsg').textContent='この端末には韓国語の読み上げの声がありません。音声Bに切り替えてください。';return}
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.ko);u.lang='ko-KR';u.voice=koVoice();speechSynthesis.speak(u);
  }else{player=new Audio(q.f);player.play()}
}
function setMode(m){MODE=m;document.querySelectorAll('.voice button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));if($('#vmsg'))$('#vmsg').textContent=''}
function stopAudio(){if(player){player.pause();player=null}if('speechSynthesis' in window)speechSynthesis.cancel()}
function start(list,isFull){Q=list;i=0;score=0;miss=[];full=isFull;$('#tot').textContent=Q.length;show();window.scrollTo(0,0)}
function show(){
  $('#bar').style.width=(i/Q.length*100)+'%';
  const q=Q[i],kro=q.t==='jk'||q.t==='fill';
  const ask={jk:'この意味の韓国語は？',kj:'この単語の意味は？',au:'聞こえた言葉の意味は？',fill:'空欄に入る言葉は？'}[q.t];
  const prompt=q.t==='au'?'<button class="play" id="pl">▶ 音声を聞く</button><div class="vmsg" id="vmsg"></div>'
    :`<div class="prompt ${q.t==='kj'?'kr':q.t==='fill'?'fill':''}">${q.t==='fill'?q.p:esc(q.p)}</div>${q.t==='fill'?`<div class="hint">ヒント：${q.hint}</div>`:''}`;
  $('#app').innerHTML=`<span class="sec">Q${i+1}.　${SEC[q.t]}</span><div class="card"><div class="num">${ask}</div>${prompt}
  <div class="opts">${q.o.map((o,k)=>`<button class="${kro?'kr':''}" data-k="${k}" data-l="${'ABCD'[k]}" style="--c:${COL[k]}">${esc(o)}</button>`).join('')}</div>
  <div class="fb" id="fb"></div><button class="next" id="nx">${i+1<Q.length?'次の問題へ':'結果を見る'}</button></div>`;
  if($('#pl'))$('#pl').onclick=play;
  document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $('#nx').onclick=()=>{stopAudio();i++; i<Q.length?show():result()};
}
function answer(k){
  const q=Q[i],bs=document.querySelectorAll('.opts button');
  bs.forEach(b=>b.disabled=true); bs[q.a].classList.add('ok');
  const good=k===q.a; if(good)score++; else{bs[k].classList.add('ng');miss.push(q)}
  const body=q.t==='au'?`<div class="ex">${esc(q.ko)}</div><div class="ja">${esc(q.m)}</div>`
    :`<div class="ans">正解：<span>${esc(q.w)}</span>　${esc(q.m)}</div><div class="ex">${q.ex[0]}</div><div class="ja">${q.ex[1]}</div>`;
  $('#fb').innerHTML=`<b style="color:${good?'var(--ok)':'var(--ng)'}">${good?'ピンポーン！ 正解':'ブー！ 正解は「'+esc(q.o[q.a])+'」'}</b>${body}`;
  $('#fb').style.display='block'; $('#nx').style.display='block';
}
function result(){
  $('#bar').style.width='100%';
  const pts=Math.round(score/Q.length*100);
  const msg=score===Q.length?'全問正解！ この章はばっちりです。':score>=Q.length*0.7?'あと少し。間違えた単語を見直しましょう。':'もう一度、章の単語ページを見てから挑戦しましょう。';
  const head=full?`<div class="score">${pts}<small> 点</small></div><div class="cnt">${Q.length}問中 ${score}問正解（1問5点）</div>`:`<div class="score">${score} / ${Q.length}</div><div class="cnt">間違えた問題のやり直し</div>`;
  $('#app').innerHTML=`<div class="card result"><div class="num">RESULT</div>${head}<div>${msg}</div>
  ${miss.length?`<div class="miss">${miss.map(q=>`<div><span class="w">${esc(q.w)}</span>　${esc(q.m)}</div>`).join('')}</div>`:''}
  <div class="btns">${miss.length?'<button class="p" id="rm">間違えた問題だけもう一度</button>':''}<button id="ra">最初からもう一度</button></div></div>`;
  if(miss.length)$('#rm').onclick=()=>start(miss.slice(),false);
  $('#ra').onclick=()=>start(makeQ(),true);
}
document.querySelectorAll('.voice button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
if('speechSynthesis' in window)speechSynthesis.getVoices();
setMode('B');
start(makeQ(),true);
</script></body></html>
